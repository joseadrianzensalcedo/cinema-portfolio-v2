<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STILLS | Photography</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .filter-nav {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 4rem;
            padding-top: 15vh;
        }

        .filter-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.8rem;
        }

        .filter-btn.active {
            color: white;
            border-bottom: 1px solid white;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .gallery-item {
            aspect-ratio: 1;
            overflow: hidden;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }
    </style>
</head>
