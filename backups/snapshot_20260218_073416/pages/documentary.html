<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHOES | Documentary</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* Minimalist Player Styles */
        body {
            overflow: hidden;
            background: #000;
        }

        .player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            z-index: 100;
            mix-blend-mode: difference;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .back-btn:hover {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="transition-curtain" style="opacity: 1;"></div>
    <a href="../index.html" class="back-btn">← BACK TO HOME</a>

    <div class="player-container">
        <!-- Vimeo Embed (Clean & Silent Interface) -->
        <!-- background=1 is too restrictive (mute/no controls). Using clean params instead. -->
        <iframe src="https://player.vimeo.com/video/76979871?h=8272103f6e&title=0&byline=0&portrait=0&badge=0&dnt=1"
            allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="../main.js"></script>
</body>

</html>
